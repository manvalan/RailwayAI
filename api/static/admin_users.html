<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - RailwayAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d11;
            --card-bg: rgba(30, 41, 59, 0.4);
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f1f5f9;
            --text-sec: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #1e1b4b 0%, #0b0d11 100%);
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-sec);
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-sec);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .badge-admin {
            background: var(--primary);
            color: white;
        }

        .badge-viewer {
            background: var(--warning);
            color: white;
        }

        .badge-normal {
            background: var(--success);
            color: white;
        }

        .badge-guest {
            background: var(--text-sec);
            color: white;
        }

        .badge-active {
            background: var(--success);
            color: white;
        }

        .badge-inactive {
            background: var(--danger);
            color: white;
        }

        select,
        button {
            padding: 0.625rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            font-family: inherit;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover,
        button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        button.danger {
            background: var(--danger);
            border-color: var(--danger);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .alert {
            padding: 1rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-sec);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>👥 User Management</h1>
        <p class="subtitle">Manage user privileges and access levels</p>

        <div id="alert" class="alert"></div>

        <div class="card">
            <div id="loading" class="loading">Loading users...</div>
            <table id="usersTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Privilege</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let apiKey = localStorage.getItem('railway_api_key');

        if (!apiKey) {
            apiKey = prompt('Enter your API Key:');
            if (apiKey) {
                localStorage.setItem('railway_api_key', apiKey);
            } else {
                alert('API Key required');
                window.location.href = '/';
            }
        }

        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function getPrivilegeBadge(privilege) {
            return `<span class="badge badge-${privilege}">${privilege.toUpperCase()}</span>`;
        }

        function getStatusBadge(isActive) {
            const status = isActive ? 'active' : 'inactive';
            const label = isActive ? 'Active' : 'Inactive';
            return `<span class="badge badge-${status}">${label}</span>`;
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/users`, {
                    headers: {
                        'X-API-Key': apiKey
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load users');
                }

                const users = await response.json();
                const tbody = document.getElementById('usersBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${user.username}</strong></td>
                        <td>
                            <select onchange="changePrivilege('${user.username}', this.value)" ${user.username === 'admin' ? 'disabled' : ''}>
                                <option value="admin" ${user.privilege === 'admin' ? 'selected' : ''}>Admin</option>
                                <option value="viewer" ${user.privilege === 'viewer' ? 'selected' : ''}>Viewer</option>
                                <option value="normal" ${user.privilege === 'normal' ? 'selected' : ''}>Normal</option>
                                <option value="guest" ${user.privilege === 'guest' ? 'selected' : ''}>Guest</option>
                            </select>
                        </td>
                        <td>${getStatusBadge(user.is_active)}</td>
                        <td>
                            <div class="actions">
                                ${user.is_active ?
                            `<button onclick="toggleStatus('${user.username}', false)" ${user.username === 'admin' ? 'disabled' : ''}>Disable</button>` :
                            `<button onclick="toggleStatus('${user.username}', true)">Enable</button>`
                        }
                                <button class="danger" onclick="deleteUser('${user.username}')" ${user.username === 'admin' ? 'disabled' : ''}>Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('usersTable').style.display = 'table';
            } catch (error) {
                showAlert('Error loading users: ' + error.message, 'error');
            }
        }

        async function changePrivilege(username, newPrivilege) {
            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/users/${username}/privilege`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({ privilege: newPrivilege })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to update privilege');
                }

                showAlert(`✅ Privilege updated for ${username} to ${newPrivilege}`);
                loadUsers();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
                loadUsers();
            }
        }

        async function toggleStatus(username, isActive) {
            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/users/${username}/status`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({ is_active: isActive })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to update status');
                }

                showAlert(`✅ User ${username} ${isActive ? 'enabled' : 'disabled'}`);
                loadUsers();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Are you sure you want to delete user "${username}"? This action cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/users/${username}`, {
                    method: 'DELETE',
                    headers: {
                        'X-API-Key': apiKey
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to delete user');
                }

                showAlert(`✅ User ${username} deleted`);
                loadUsers();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        // Load users on page load
        loadUsers();
    </script>
</body>

</html>
