version: '3.8'

services:
  railway-ai:
    build: .
    container_name: railway-ai
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY:-RailwayAISecureKeyDefault2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONPATH=/app
    volumes:
      # - /opt/docker-projects/railway-ai:/app  <-- COMMENTED OUT TO FORCE USE OF IMAGE CODE
      - ./railway.db:/app/railway.db # Persist DB
      - ./scenarios:/app/scenarios # Persist Scenarios
      - ./models:/app/models # Persist Models
    working_dir: /app
    restart: always

networks:
  default:
    name: railway-network
