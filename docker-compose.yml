version: '3.8'

services:
  railway-ai:
    build: .
    container_name: railway-ai
    # Port 8080 is now internal only (accessed via Caddy)
    expose:
      - "8080"
    environment:
      - SECRET_KEY=${SECRET_KEY:-RailwayAISecureKeyDefault2026}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONPATH=/app
    volumes:
      - /opt/docker-projects/railway-ai:/app # Usiamo il codice locale (git pulled) per aggiornamenti rapidi
      - ./railway.db:/app/railway.db # Persist DB
      - ./scenarios:/app/scenarios # Persist Scenarios
      - ./models:/app/models # Persist Models
    working_dir: /app
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: railway-caddy
    ports:
      - "80:80" # HTTP (auto-redirects to HTTPS)
      - "443:443" # HTTPS
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    restart: always
    depends_on:
      - railway-ai

networks:
  default:
    name: railway-network

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
